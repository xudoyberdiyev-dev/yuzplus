</helmet>
<div style="max-width:1040px;margin:0 auto;padding:48px 32px;display:flex;flex-direction:column;gap:24px">
<header style="display:flex;flex-direction:column;gap:8px"><a href="Mundarija.dc.html" style="font-size:13px;font-weight:600">← Mundarija</a><h1 style="margin:0;font-size:24px;line-height:32px;font-weight:600">Biznes qoidalari</h1><p style="margin:0;font-size:14px;line-height:20px;color:#5B6B6A">Barcha ekranlarda qabul qilingan qoidalar. Har qoida — bir qator. Ekranlar shu ro‘yxatga zid bo‘lmasligi kerak.</p></header>
<sc-for list="{{ groups }}" as="g"><section style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:8px;overflow:hidden"><h2 style="margin:0;padding:14px 20px;font-size:15px;line-height:22px;font-weight:600;border-bottom:1px solid #E2E8F0"><span style="font-family:'JetBrains Mono',monospace;color:#5B6B6A">{{ g.n }}</span> · {{ g.t }}</h2>
<sc-for list="{{ g.rows }}" as="r"><div style="display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:8px 20px;border-bottom:1px solid #E2E8F0;font-size:14px;line-height:20px"><span style="font-family:'JetBrains Mono',monospace;font-size:12px;line-height:20px;color:#5B6B6A">{{ r.n }}</span><span style="text-wrap:pretty">{{ r.t }}</span></div></sc-for></section></sc-for>
</div>
</x-dc>
